# Builds the Android app (android/) when it changes: signed with the release
# key when the repository has it as secrets, else unsigned, just to check it
# builds. The package is kept as an artifact; publishing it is a copy to
# public/app/nopload.apk (see android/README.md).
name: Android app

on:
  push:
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-36 build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"
      - name: Signing key
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE" ]; then
            echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/nopload.jks"
            echo "NOPLOAD_KEYSTORE=$RUNNER_TEMP/nopload.jks" >> "$GITHUB_ENV"
          fi
      # The app launching as a phone launches it (from its icon, Open with,
      # the share sheet; with Chrome, another browser or none; after a crash),
      # on Android 7 to 16: app/src/test (Robolectric).
      - name: Launch tests
        run: gradle --no-daemon testReleaseUnitTest
      - name: Build
        env:
          NOPLOAD_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: gradle --no-daemon assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: nopload-android
          path: android/app/build/outputs/apk/release/*.apk
